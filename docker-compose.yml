name: normocontrol

services:
  gateway:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    configs:
      - source: gateway
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "${APP_BIND:?APP_BIND must be set}:${APP_PORT:?APP_PORT must be set}:80"
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

  frontend:
    image: normocontrol.registry.twcstorage.ru/normative-control-onprem-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    environment:
      AUTH_MODE: oidc
      BUGSINK_DSN: ""
      APP_ENVIRONMENT: production
      APP_RELEASE: ${IMAGE_TAG}

  api:
    image: normocontrol.registry.twcstorage.ru/normative-control-onprem-api:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?OIDC_ISSUER_URI must be set}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID must be set}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET must be set}
      OIDC_SCOPES: ${OIDC_SCOPES:?OIDC_SCOPES must be set}
      OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      HOST_URL: ${HOST_URL:?HOST_URL must be set}
      SITE_URL: ${HOST_URL}/
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      S3_URL: ${S3_URL:?S3_URL must be set}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
      S3_REGION: ${S3_REGION:?S3_REGION must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST must be set}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT must be set}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_QUEUE: ${RABBITMQ_REQUEST_QUEUE:?RABBITMQ_REQUEST_QUEUE must be set}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE:?RABBITMQ_RESULT_QUEUE must be set}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  checker:
    image: normocontrol.registry.twcstorage.ru/normative-control-onprem-core:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@${RABBITMQ_HOST:?RABBITMQ_HOST must be set}:${RABBITMQ_PORT:?RABBITMQ_PORT must be set}/
      RABBITMQ_REQUEST_QUEUE: ${RABBITMQ_REQUEST_QUEUE:?RABBITMQ_REQUEST_QUEUE must be set}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE:?RABBITMQ_RESULT_QUEUE must be set}
      DOCUMENT_CHECK_WORKERS: ${DOCUMENT_CHECK_WORKERS:?DOCUMENT_CHECK_WORKERS must be set}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT must be set}
      S3_SECURE: ${S3_SECURE:?S3_SECURE must be set}
      S3_REGION: ${S3_REGION:?S3_REGION must be set}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: normative-control
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d normative-control']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:?S3_BUCKET must be set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/bitnami/minio/data

configs:
  gateway:
    content: |
      server {
        listen 80;
        client_max_body_size 50m;

        location /api/ {
          proxy_pass http://api:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_read_timeout 120s;
        }

        location / {
          proxy_pass http://frontend:80;
          proxy_set_header Host $$host;
        }
      }

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
