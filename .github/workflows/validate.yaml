name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: docker compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docker-compose.yml with .env.example
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=placeholder/' .env.example > .env
          docker compose config --quiet
